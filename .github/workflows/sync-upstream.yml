name: Sync upstream cloud-mail

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge maillab/cloud-mail main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/maillab/cloud-mail.git 2>/dev/null || git remote set-url upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main"
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
